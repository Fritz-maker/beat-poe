<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="face-svg twain" role="img" aria-label="Mark Twain">
  <!-- Original caricature for Beat Poe! Add class "cross" to the <svg> for the grumpy state. -->
  <style>
    .twain .mv { transition: transform .28s cubic-bezier(.3,1.7,.5,1), opacity .2s; transform-box: fill-box; transform-origin: center; }
    .twain .ink { stroke: #3a2a1e; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .twain .only-cross { opacity: 0; }
    .twain.cross .only-cross { opacity: 1; }
    .twain.cross .only-calm { opacity: 0; }
    .twain .brow-l { transform: rotate(-10deg); }
    .twain .brow-r { transform: translate(0, -5px) rotate(14deg); }
    .twain.cross .brow-l { transform: translate(5px, 9px) rotate(26deg); }
    .twain.cross .brow-r { transform: translate(-5px, 9px) rotate(-26deg); }
    .twain .stache-l { transform-origin: 100% 15%; transform: rotate(6deg); }
    .twain .stache-r { transform-origin: 0% 15%; transform: rotate(-6deg); }
    .twain.cross .stache-l { transform: translate(0, 2px) rotate(-17deg); }
    .twain.cross .stache-r { transform: translate(0, 2px) rotate(17deg); }
    .twain.cross .lid { transform: translate(0, 5px); }
    .twain .pupil { transform: translate(1.6px, 0); }
    .twain.cross .pupil { transform: translate(0, 1.4px); }
    .twain .blush { opacity: .35; }
    .twain.cross .blush { opacity: .95; }
  </style>
  <defs>
    <clipPath id="tw-eye-l"><ellipse cx="80" cy="92" rx="8.5" ry="7.5"/></clipPath>
    <clipPath id="tw-eye-r"><ellipse cx="120" cy="92" rx="8.5" ry="7.5"/></clipPath>
  </defs>

  <!-- white suit, collar, bow tie -->
  <path class="ink" fill="#f3eee2" d="M22 204c2-34 26-52 78-52s76 18 78 52z"/>
  <path class="ink" fill="#fffdf6" d="M84 152l16 20 16-20-6-8H90z"/>
  <path class="ink" fill="none" d="M70 158l22 40M130 158l-22 40"/>
  <path class="ink" fill="#2b2230" d="M100 166l-15-8v16zM100 166l15-8v16z"/>
  <circle class="ink" cx="100" cy="166" r="3.4" fill="#2b2230"/>

  <!-- the hair cloud -->
  <g class="ink" fill="#f6f3ec">
    <circle cx="48" cy="100" r="19"/><circle cx="152" cy="100" r="19"/>
    <circle cx="50" cy="72" r="24"/><circle cx="150" cy="72" r="24"/>
    <circle cx="68" cy="47" r="26"/><circle cx="132" cy="47" r="26"/>
    <circle cx="100" cy="37" r="28"/>
  </g>
  <path fill="#f6f3ec" d="M44 60h112v54H44z"/>

  <!-- head -->
  <path class="ink" fill="#ecc09f" d="M58 88c0-30 18-44 42-44s42 14 42 44c0 32-18 56-42 56s-42-24-42-56z"/>
  <!-- forelock -->
  <path class="ink" fill="#f6f3ec" d="M58 82c-2-26 16-44 44-44 24 0 40 14 42 42-10-14-22-22-36-22 4 6 4 10 2 14-8-10-20-14-30-12-10 2-18 10-22 22z"/>

  <!-- cheeks -->
  <ellipse class="blush mv" cx="68" cy="110" rx="10" ry="7" fill="#e2725b"/>
  <ellipse class="blush mv" cx="132" cy="110" rx="10" ry="7" fill="#e2725b"/>

  <!-- eyes -->
  <g clip-path="url(#tw-eye-l)">
    <ellipse cx="80" cy="92" rx="8.5" ry="7.5" fill="#fffdf6"/>
    <g class="pupil mv"><circle cx="80" cy="93" r="4.2" fill="#3a2a1e"/><circle cx="81.6" cy="91.4" r="1.3" fill="#fffdf6"/></g>
    <g class="lid mv"><rect x="68" y="70" width="24" height="18.5" fill="#ecc09f"/><path d="M68 88.5h24" stroke="#3a2a1e" stroke-width="2.6"/></g>
  </g>
  <g clip-path="url(#tw-eye-r)">
    <ellipse cx="120" cy="92" rx="8.5" ry="7.5" fill="#fffdf6"/>
    <g class="pupil mv"><circle cx="120" cy="93" r="4.2" fill="#3a2a1e"/><circle cx="121.6" cy="91.4" r="1.3" fill="#fffdf6"/></g>
    <g class="lid mv"><rect x="108" y="70" width="24" height="18.5" fill="#ecc09f"/><path d="M108 88.5h24" stroke="#3a2a1e" stroke-width="2.6"/></g>
  </g>
  <ellipse class="ink" cx="80" cy="92" rx="8.5" ry="7.5" fill="none"/>
  <ellipse class="ink" cx="120" cy="92" rx="8.5" ry="7.5" fill="none"/>
  <!-- laugh lines (calm) and scowl crease (cross) -->
  <path class="ink only-calm mv" fill="none" stroke-width="1.8" d="M63 88l-5-3M63 93h-6M137 88l5-3M137 93h6"/>
  <path class="ink only-cross mv" fill="none" stroke-width="2.2" d="M96 78v9M104 78v9"/>

  <!-- eyebrows: big and bushy -->
  <path class="ink brow-l mv" fill="#f6f3ec" d="M64 79c2-7 10-10 18-9s13 4 14 8c-5 3-10 3-16 2s-11 0-16-1z"/>
  <path class="ink brow-r mv" fill="#f6f3ec" d="M136 79c-2-7-10-10-18-9s-13 4-14 8c5 3 10 3 16 2s11 0 16-1z"/>

  <!-- chin and lower lip -->
  <path class="ink" fill="none" stroke-width="2" d="M92 134q8 4 16 0"/>

  <!-- cigar: whole when calm -->
  <g class="only-calm mv">
    <g transform="rotate(-14 118 126)">
      <rect class="ink" x="112" y="121" width="46" height="10" rx="5" fill="#8a5631"/>
      <rect x="150" y="122.3" width="8" height="7.4" rx="3.7" fill="#c9c2b8"/>
      <circle cx="158" cy="126" r="2.6" fill="#f08a3c"/>
    </g>
    <path fill="none" stroke="#c9c2b8" stroke-width="2.6" stroke-linecap="round" d="M170 108c8-5 0-11 7-17s1-12 8-17s2-10 6-14"/>
  </g>
  <!-- cigar: snapped when cross -->
  <g class="only-cross mv">
    <g transform="rotate(-6 118 126)"><rect class="ink" x="112" y="121" width="24" height="10" rx="4" fill="#8a5631"/></g>
    <g transform="rotate(38 140 126)"><rect class="ink" x="138" y="122" width="22" height="10" rx="4" fill="#8a5631"/><circle cx="160" cy="127" r="2.6" fill="#8f8a84"/></g>
    <path class="ink" fill="none" stroke-width="2" d="M136 114l3-6M142 117l7-3"/>
  </g>

  <!-- the walrus mustache, in two halves so it can droop -->
  <path class="ink stache-l mv" fill="#f6f3ec" d="M101 112c-10-6-28-4-40 12 6 6 14 8 22 6 8-2 14-6 18-12z"/>
  <path class="ink stache-r mv" fill="#f6f3ec" d="M99 112c10-6 28-4 40 12-6 6-14 8-22 6-8-2-14-6-18-12z"/>
  <path fill="none" stroke="#c9c2b8" stroke-width="1.6" stroke-linecap="round" d="M88 116l-10 8M82 114l-12 8M112 116l10 8M118 114l12 8"/>

  <!-- nose -->
  <path class="ink" fill="#e2ae8c" d="M100 92c-3 6-10 10-10 16 0 5 5 8 10 8s10-3 10-8c0-6-7-10-10-16z"/>

  <!-- steam when cross -->
  <g class="only-cross mv" fill="none" stroke="#f6f3ec" stroke-width="3" stroke-linecap="round">
    <path d="M24 44q6-6 0-12q-6-6 0-12"/><path d="M176 44q-6-6 0-12q6-6 0-12"/>
  </g>
</svg>
