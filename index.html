<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121a">
<title>Beat Poe!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23dbc494'/%3E%3Ctext x='16' y='24' font-size='22' font-weight='800' font-family='sans-serif' text-anchor='middle' fill='%23332114'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main id="app" class="loading">

  <!-- the stage: the foe's face and what the foe says -->
  <section class="stage" id="foeBox">
    <div class="face" id="face">
      <!-- placeholder bust: each author's caricature goes here -->
      <svg role="img" aria-label="Placeholder for the foe's face" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="#17121a" stroke="#594761" stroke-width="2"/>
        <circle cx="50" cy="40" r="17" fill="none" stroke="#9e948c" stroke-width="2.5"/>
        <path d="M20 86c4-20 16-28 30-28s26 8 30 28" fill="none" stroke="#9e948c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M43 39h.1M57 39h.1" stroke="#9e948c" stroke-width="4" stroke-linecap="round"/>
        <path d="M44 47q6 4 12 0" fill="none" stroke="#9e948c" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="stage-side">
      <div class="row top">
        <div class="who">
          <div class="name" id="foeName">Beat Poe!</div>
          <div class="small" id="foeCount"></div>
        </div>
        <button id="btnGear" class="icon" aria-label="Settings">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        </button>
      </div>
      <div class="bubble" id="msg" aria-live="polite"></div>
    </div>
  </section>

  <!-- the wall: the foe's health and the curse countdown -->
  <section class="wall">
    <div class="bar foebar"><div class="fill" id="foeFill"></div></div>
    <div class="row small">
      <span class="num" id="foeHp"></span>
      <span class="wave" id="wave"><span id="waveText"></span><span class="beads" id="beads"></span></span>
    </div>
  </section>

  <section class="tray">
    <div class="word" id="word"></div>
    <div class="small" id="wordInfo"></div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <section class="board"><div class="grid" id="grid"></div></section>

  <section class="buttons">
    <button id="btnBack" aria-label="Undo last letter">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg>
    </button>
    <button id="btnClear">Clear</button>
    <button id="btnScramble">Scramble</button>
    <button id="btnPlay" class="primary">Play</button>
  </section>

  <section class="last">
    <div id="lastLine" class="small"></div>
    <button id="btnShow" class="chip" hidden>Show me</button>
  </section>

  <section class="you" id="youBox">
    <svg aria-hidden="true" class="heart" width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>
    <div class="bar youbar"><div class="fill" id="youFill"></div></div>
    <span class="num small" id="youHp"></span>
    <span class="lives" id="lives" title="Bonus lives (used in the final fight)">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6l-6.300 3.600 1.500-7L2 9.400l7-.8z"/></svg>
      <span id="livesNum">0</span>
    </span>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <h1 id="ovTitle"></h1>
      <p id="ovText"></p>
      <button id="ovBtn" class="primary">Continue</button>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <div class="card panel">
      <h1>Settings</h1>
      <p class="label">The &ldquo;best word&rdquo; you are measured against comes from:</p>
      <div class="seg" role="group" aria-label="Best word list">
        <button id="setCommon">Common words</button>
        <button id="setAll">All words</button>
      </div>
      <p class="small hint">Common words makes perfect plays (and bonus lives) easier to earn. You can always play any valid word.</p>
      <button id="setClose" class="primary">Done</button>
    </div>
  </div>

  <div class="overlay" id="loading">
    <div class="card">
      <h1>Beat Poe!</h1>
      <p id="loadText">Loading the dictionary&hellip;</p>
    </div>
  </div>
</main>
<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
